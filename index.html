<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JTCF – Connexion</title>

<!-- ── Application installable ──────────────────────────────────────────────
     Ces quatre lignes sont ce qui permet à Windows et à Android de proposer
     l'installation. Sans elles, l'application reste un simple site web.
     ─────────────────────────────────────────────────────────────────────── -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a3f4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JTCF">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(160deg, #2a3f4e, #3d5a6e); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  :root { --or: #C9A227; --or-pale: #fdf6e3; --bleu: #3d5a6e; --bleu-fonce: #2a3f4e; --blanc: #ffffff; --gris: #718096; --erreur: #e53e3e; }
  .login-box { background: white; border-radius: 20px; padding: 36px 28px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
  .stars { font-size: 16px; color: var(--or); letter-spacing: 6px; margin-bottom: 6px; }
  .logo { font-size: 22px; font-weight: 800; color: var(--or); letter-spacing: 2px; text-transform: uppercase; }
  .logo-sub { font-size: 11px; color: var(--bleu); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; font-weight: 600; }
  .divider { width: 50px; height: 3px; background: var(--or); margin: 16px auto; border-radius: 2px; }
  .title { font-size: 15px; font-weight: 700; color: var(--bleu-fonce); margin-bottom: 6px; }
  .subtitle { font-size: 12px; color: var(--gris); margin-bottom: 24px; }
  .field { margin-bottom: 16px; text-align: left; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: var(--bleu); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .field input { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; font-family: inherit; color: var(--bleu-fonce); transition: border 0.2s; outline: none; text-transform: uppercase; letter-spacing: 1px; -webkit-appearance: none; }
  .field input:focus { border-color: var(--or); }
  .field input.error { border-color: var(--erreur); }
  .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--bleu-fonce), var(--bleu)); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 1px; margin-top: 4px; touch-action: manipulation; -webkit-appearance: none; }
  .btn:disabled { opacity: .6; }
  .error-msg { display: none; background: #fff5f5; border: 1px solid #fed7d7; color: var(--erreur); font-size: 12px; font-weight: 600; padding: 10px 14px; border-radius: 8px; margin-top: 12px; }
  .error-msg.visible { display: block; }
  .footer-note { margin-top: 24px; font-size: 11px; color: var(--gris); line-height: 1.6; }
  .footer-note strong { color: var(--bleu); }
  .btn-install { display: none; width: 100%; margin-top: 14px; padding: 12px; background: var(--or-pale); color: #744210; border: 2px solid var(--or); border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .aide-install { display: none; margin-top: 14px; background: var(--or-pale); border-left: 3px solid var(--or); border-radius: 0 8px 8px 0; padding: 11px 13px; font-size: 11.5px; color: #744210; line-height: 1.6; text-align: left; }
</style>
</head>
<body>
<div class="login-box">
  <div class="stars">★ ★ ★</div>
  <div class="logo">JT Conseil Formation</div>
  <div class="logo-sub">Saint-Joseph</div>
  <div class="divider"></div>
  <div class="title">Accès Mon Espace</div>
  <div class="subtitle">Alternance, formation continue et stage — même page de connexion</div>
  <div class="field">
    <label>Votre identifiant</label>
    <input type="text" id="identifiant" placeholder="Ex : AB01, STG01, CIP01..." maxlength="10" />
  </div>
  <div class="field">
    <label>Code d'accès</label>
    <div style="position:relative;">
      <input type="password" id="code" placeholder="••••••••" maxlength="20" style="padding-right:44px;width:100%;box-sizing:border-box;" />
      <button type="button" id="btnToggleCode" onclick="toggleCode()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#718096;padding:4px;line-height:1;">👁️</button>
    </div>
  </div>
  <button class="btn" id="btnConnect">ACCÉDER À MON ESPACE</button>
  <div class="error-msg" id="errorMsg">❌ Identifiant ou code incorrect.</div>

  <button class="btn-install" id="btnInstall">⬇️ Installer l'application</button>
  <div class="aide-install" id="aideInstall"></div>

  <div class="footer-note">Identifiant oublié ?<br>Contactez-nous : <a href="mailto:contact@tbrgroup.fr" style="color:#3d5a6e;font-weight:700;">contact@tbrgroup.fr</a></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYPFGv5tMYfKkARO4HeQxPQF_55SpbfgE",
  authDomain: "jtcf-alternance.firebaseapp.com",
  databaseURL: "https://jtcf-alternance-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "jtcf-alternance",
  storageBucket: "jtcf-alternance.firebasestorage.app",
  messagingSenderId: "961150611919",
  appId: "1:961150611919:web:ae8be337575ab1295f62ba"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
await signInAnonymously(auth).catch(()=>{});
const CODE = "JTCF2026";

// Une seule table : ajouter un profil ne demande plus de toucher à la logique.
const ESPACES = [
  { noeud: 'alternants',   cle: 'jtcf_alt_user',   page: 'livret.html' },
  { noeud: 'stagiairesFC', cle: 'jtcf_fc_user',    page: 'livret-fc.html' },
  { noeud: 'stagiaires',   cle: 'jtcf_stg_user',   page: 'livret-stage.html' },
  { noeud: 'cips',         cle: 'jtcf_cip_user',   page: 'cip.html' },
  { noeud: 'formateurs',   cle: 'jtcf_form_user',  page: 'formatrice.html' },
  { noeud: 'admins',       cle: 'jtcf_admin_user', page: 'admin.html' }
];

async function connexion(e) {
  if (e) e.preventDefault();
  const champId = document.getElementById('identifiant');
  const champCode = document.getElementById('code');
  const btn = document.getElementById('btnConnect');
  const id = champId.value.trim().toUpperCase();
  const code = champCode.value.trim().toUpperCase();
  const err = document.getElementById('errorMsg');

  champId.classList.remove('error');
  champCode.classList.remove('error');
  err.classList.remove('visible');
  err.textContent = '❌ Identifiant ou code incorrect.';

  if (code !== CODE) {
    champCode.classList.add('error');
    err.classList.add('visible');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'CONNEXION...';

  try {
    // Les six espaces sont interrogés en parallèle : une seule attente.
    const trouves = await Promise.all(
      ESPACES.map(function (e2) {
        return get(ref(db, e2.noeud + '/' + id))
          .then(function (s) { return s.exists(); })
          .catch(function () { return false; });
      })
    );

    for (let i = 0; i < ESPACES.length; i++) {
      if (!trouves[i]) continue;
      const e3 = ESPACES[i];
      sessionStorage.setItem(e3.cle, id);
      if (e3.noeud === 'formateurs' && id === 'FORM02') { window.location.href = 'formatrice-form02.html'; return; }
      if (e3.noeud === 'formateurs' && id === 'FORM03') { window.location.href = 'formatrice-form03.html'; return; }
      window.location.href = e3.page;
      return;
    }

    champId.classList.add('error');
    err.classList.add('visible');
  } catch (err2) {
    err.textContent = '❌ Erreur de connexion. Réessayez.';
    err.classList.add('visible');
  } finally {
    btn.disabled = false;
    btn.textContent = 'ACCÉDER À MON ESPACE';
  }
}

document.getElementById('btnConnect').addEventListener('touchend', connexion, {passive:false});
document.getElementById('btnConnect').addEventListener('click', connexion);
document.addEventListener('keydown', function(e) { if (e.key === 'Enter') connexion(); });
</script>

<script>
function toggleCode() {
  const input = document.getElementById('code');
  const btn = document.getElementById('btnToggleCode');
  if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
  else { input.type = 'password'; btn.textContent = '👁️'; }
}

/* ── Installation sur ordinateur et sur téléphone ─────────────────────────
   Chrome et Edge proposent l'installation d'eux-mêmes ; on récupère leur
   proposition pour l'offrir par un vrai bouton. Safari sur iPhone ne le
   permet pas : on explique alors la manipulation en toutes lettres.
   ─────────────────────────────────────────────────────────────────────── */
(function () {
  var proposition = null;
  var btn = document.getElementById('btnInstall');
  var aide = document.getElementById('aideInstall');

  // Déjà installée ? On ne propose rien.
  var installee = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    proposition = e;
    if (!installee) btn.style.display = 'block';
  });

  btn.addEventListener('click', async function () {
    if (!proposition) return;
    btn.disabled = true;
    proposition.prompt();
    try { await proposition.userChoice; } catch (e) { }
    proposition = null;
    btn.style.display = 'none';
  });

  window.addEventListener('appinstalled', function () {
    btn.style.display = 'none';
    aide.style.display = 'none';
  });

  // iPhone et iPad : pas de proposition automatique, on guide.
  var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (iOS && !installee) {
    aide.innerHTML = '<strong>Installer sur votre iPhone</strong><br>'
      + 'Touchez le bouton <strong>Partager</strong> en bas de Safari, '
      + 'puis <strong>Sur l\'écran d\'accueil</strong>.';
    aide.style.display = 'block';
  }

  // Le service worker rend l'installation possible et gère le hors connexion.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {
        // Une inscription qui échoue ne doit jamais empêcher la connexion.
      });
    });
  }
})();
</script>
</body>
</html>
